[tox]
isolated_build = True

envlist =
    py{311,312,313,314}-pydantic{latest}-{keyring}-pykeepass{4}-SQLAlchemy{14}
    # Note pydantic2.0 only works with python 3.11
    py{311}-pydantic_min-{keyring}-pykeepass{4}-SQLAlchemy{14}
    py{314}-pydantic{212,213,latest}-{keyring}-pykeepass{4}-SQLAlchemy{14}
    py{314}-pydantic{latest}-{keyring,no_keyring}-{pykeepass4,no_pykeepass}-SQLAlchemy{14}
    py{314}-pydantic{latest}-{keyring}-pykeepass{3,4}-SQLAlchemy{14}
    py{314}-pydantic{latest}-{keyring}-pykeepass{4}-SQLAlchemy{13,14,20}
    no_lock

# Note: Latest tox docs do not properly cover this syntax.
# See older version instead
# https://tox.wiki/en/3.27.1/config.html

[tox:.package]
# note tox will use the same python version as under what tox is installed to package
# so unless this is python 3 you can require a given python version for the packaging
# environment via the basepython key
# basepython = py -3.11

[testenv]
;recreate=True
;package=editable
extras=sqlalchemy, pykeepass, s3, aws, toml, keyring
allowlist_externals=
    uv

deps =
    pydantic_min: pydantic >=2.7.0,<2.8.0
    pydantic212: pydantic >=2.12.0,<2.13.0
    pydantic213: pydantic >=2.13.0,<2.14.0
    pydanticlatest: pydantic

    keyring: keyring
    # no_keyring: nothing to install

    pykeepass4: pykeepass >=4.0.0
    pykeepass3: pykeepass <=3.1.1,<4.0.0
    # no_pykeepass: nothing to install

    SQLAlchemy13: SQLAlchemy >=1.3,<1.4
    SQLAlchemy14: SQLAlchemy >=1.4,<1.5
    SQLAlchemy20: SQLAlchemy >=2.0,<3.0

    tox-uv
    pytest
    pynamodb
    cachetools
    toml
    boto3
    moto[all]
    requests-aws4auth
    requests-mock
    pyyaml



;commands =
;    pytest --junitxml=junit/{envname}.xml -o junit_suite_name=tox-{envname} tests/ {posargs}
commands = pytest {posargs}

[testenv:no_lock]
runner = uv-venv-runner
description = dev environment no lock
uv_sync_flags = --quiet
extras =
    sqlalchemy
    pykeepass
    s3
    toml
    keyring

[pytest]
minversion = 7.0
# addopts = -n=auto
testpaths =
    tests

